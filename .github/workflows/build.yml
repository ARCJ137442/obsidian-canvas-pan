name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Package plugin
        shell: bash
        run: |
          mkdir canvas-keyboard-pan
          cp main.js manifest.json styles.css canvas-keyboard-pan/
          zip -r canvas-keyboard-pan.zip canvas-keyboard-pan

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            main.js
            manifest.json
            styles.css
            canvas-keyboard-pan.zip
          if-no-files-found: error
